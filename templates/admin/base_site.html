{% extends 'admin/base.html' %}
{% load static %}

{% block branding %}
<div class="d-flex align-items-center gap-2">
    <img src="{% static 'sisikwaPamoja/images/logo.jpeg' %}" alt="Logo" style="width:35px;height:35px;object-fit:cover;border-radius:50%;border:2px solid rgba(255,255,255,.3);">
    <div>
        <span style="color:#fff;font-weight:900;font-size:1rem;">SISIPAMOJA</span>
        <span style="color:#cd7f3d;font-size:.7rem;font-weight:700;letter-spacing:1.5px;display:block;margin-top:-2px;">ADMIN</span>
    </div>
</div>
{% endblock %}

{% block footer %}
    {% if not is_popup %}
        <footer class="app-footer {{ jazzmin_ui.footer_classes }}">
            © 2026 SisiPamoja Welfare Sacco · All rights reserved
        </footer>
    {% endif %}
{% endblock %}
