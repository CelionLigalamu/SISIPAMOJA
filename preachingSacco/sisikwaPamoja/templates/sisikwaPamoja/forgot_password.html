{% extends 'sisikwaPamoja/base.html' %}
{% load static %}
{% block title %}SISIPAMOJA | Forgot Password{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card p-4 p-md-5">

                <div class="text-center mb-4">
                    <img src="{% static 'sisikwaPamoja/images/logo.jpeg' %}" alt="SISIPAMOJA" class="mb-3" style="width:70px;height:70px;object-fit:cover;border-radius:50%;border:3px solid var(--primary-color);">
                    <h3 class="fw-bold">Forgot Password?</h3>
                    <p class="text-muted">
                        Click below to reset your 
                        password via email
                    </p>
                </div>

                <div class="d-grid mb-3">
                    <a href="{% url 'password_reset' %}"
                       class="btn btn-primary btn-lg">
                        <i class="fas fa-envelope me-2"></i>
                        Reset Password via Email
                    </a>
                </div>

                <p class="text-center text-muted mb-0">
                    Remember your password?
                          <a href="{% url 'login' %}"
                              class="text-decoration-none fw-semibold text-primary-theme">
                        Sign In
                    </a>
                </p>

            </div>
        </div>
    </div>
</div>
{% endblock %}
