{% extends 'sisikwaPamoja/base.html' %}
{% block title %}SISIPAMOJA | Reset Password{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card p-4 p-md-5">

                <div class="text-center mb-4">
                          <i class="fas fa-key fa-3x mb-3 text-primary-theme"></i>
                    <h3 class="fw-bold">Forgot Password?</h3>
                    <p class="text-muted">
                        Enter your email and we'll send
                        you a secure reset link
                    </p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label fw-semibold">
                            Email Address *
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-envelope"></i>
                            </span>
                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="Enter your email"
                                   required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit"
                                class="btn btn-primary btn-lg">
                            <i class="fas fa-paper-plane me-2"></i>
                            Send Reset Link
                        </button>
                    </div>

                    <p class="text-center text-muted mb-0">
                        Remember your password?
                                <a href="{% url 'login' %}"
                                    class="text-decoration-none fw-semibold text-primary-theme">
                            Sign In
                        </a>
                    </p>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
