{% extends 'sisikwaPamoja/base.html' %}
{% load static %}
{% block title %}SISIPAMOJA | Password Changed{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card p-4 p-md-5 text-center">

                <img src="{% static 'sisikwaPamoja/images/logo.jpeg' %}" alt="SISIPAMOJA" class="mb-3" style="width:70px;height:70px;object-fit:cover;border-radius:50%;border:3px solid var(--primary-color);">
                <h3 class="fw-bold">Password Changed!</h3>
                <p class="text-muted mb-4">
                    Your password has been successfully
                    reset. You can now login with
                    your new password.
                </p>

                <a href="{% url 'login' %}"
                   class="btn btn-primary btn-lg">
                    <i class="fas fa-sign-in-alt me-2"></i>
                    Login Now
                </a>

            </div>
        </div>
    </div>
</div>
{% endblock %}
